<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#0d1117;color:#c9d1d9;font-family:sans-serif;padding:20px}
.srow{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:10px 14px;cursor:pointer;max-width:600px}
.snews{font-size:.8rem;color:#8b949e;line-height:1.45;padding-top:8px;margin-top:8px;border-top:1px solid #30363d;cursor:pointer}
.nage{display:inline-block;background:#1a2029;border:1px solid #30363d;border-radius:4px;padding:1px 6px;margin-right:8px;font-size:11px}
.rnage{display:inline-block;min-width:44px;font-size:.72rem;color:#58a6ff;border:1px solid #58a6ff;border-radius:8px;padding:0 6px;margin-right:8px}
.spane.reason{color:#9db4d0}
#log{margin-top:20px;font-size:12px;color:#58a6ff;white-space:pre-wrap}
</style></head><body>
<h3>Flip test</h3>
<div id="stripview">
<div class="srow" data-t="BE">
<div class="shead"><b>BE</b> $264.9 (header - should open lightbox)</div>
<div class="snews" data-t="BE">
<div class="spane news"><span class="nage">today</span><span>On Oct 13, LS Electric signed a deal...</span></div>
<div class="spane reason" hidden><span class="rnage">levels</span>Inst $127.85 reasoning text here</div>
</div>
</div>
</div>
<div id="log">click log:</div>
<script>
function flipNews(n){const a=n.querySelector('.news'),b=n.querySelector('.reason');if(!a||!b)return;const showReason=b.hidden;a.hidden=!showReason;b.hidden=showReason;}
const sv=document.getElementById('stripview');
const log=document.getElementById('log');
sv.addEventListener('click',e=>{
  log.textContent+='\nclick target='+e.target.tagName+'.'+e.target.className;
  const n=e.target.closest('.snews');
  log.textContent+=' closest(.snews)='+(n?'FOUND':'null');
  if(n){if(n.querySelector('.reason')){flipNews(n);log.textContent+=' FLIPPED';}return;}
  const row=e.target.closest('.srow');
  log.textContent+=' closest(.srow)='+(row?'FOUND':'null');
  if(row){log.textContent+=' LIGHTBOX';}
});
</script></body></html>
